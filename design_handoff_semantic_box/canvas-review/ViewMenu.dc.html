<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root{
      --bg:#f5ead8; --surface:#ebddc5; --text:#201e1d;
      --accent:#c67139; --divider:rgba(32,30,29,.16);
      --n100:#f9f4ed; --n300:#dcd3c4; --n400:#c0b6a5; --n500:#a19786; --n600:#82796a; --n700:#645c50;
      --acc100:#fff2eb; --acc700:#8c491a;
      --mono:'JetBrains Mono',ui-monospace,monospace;
      --body:'Figtree',system-ui,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--body);}
    a{color:#8c491a;} a:hover{color:#643312;}

    .frame{padding:24px;display:flex;flex-direction:column;gap:10px;}
    .mode-label{font:500 9px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--n600);}
    .stack{border:1px solid var(--divider);border-radius:8px;overflow:visible;background:var(--bg);}

    .topbar{min-height:52px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--divider);border-radius:8px 8px 0 0;}
    .wordmark{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;}
    .spacer{flex:1;min-width:12px;}
    .search{width:150px;padding:7px 11px;border:1px dashed var(--n400);border-radius:999px;background:var(--n100);font:400 11px/1 var(--mono);color:var(--n500);opacity:.55;}

    .seg{display:flex;padding:2px;border:1px solid var(--n400);border-radius:999px;background:var(--n100);}
    .seg-opt{padding:5px 11px;border:0;border-radius:999px;background:transparent;color:var(--n700);font:500 10px/1 var(--mono);cursor:pointer;}
    .seg-opt.sel{background:var(--accent);color:var(--n100);}
    .seg-opt.hop{width:26px;padding:5px 0;text-align:center;}

    .tpill{position:relative;padding:6px 11px;border:1px solid var(--n400);border-radius:999px;background:transparent;color:inherit;white-space:nowrap;font:400 10px/1 var(--mono);cursor:pointer;}
    .tpill.on{border-color:var(--accent);background:var(--acc100);}

    .toolbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--divider);background:var(--bg);}
    .tlabel{font:500 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--n600);}
    .vrule{width:1px;align-self:stretch;background:var(--divider);margin:2px 3px;}

    .pop{position:relative;}
    .popmenu{position:absolute;top:32px;right:0;z-index:9;width:196px;background:var(--bg);border:1px solid var(--n400);border-radius:8px;box-shadow:0 12px 32px rgba(46,43,37,.22);padding:7px;display:flex;flex-direction:column;gap:1px;}
    .popmenu .grp{font:500 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--n600);padding:7px 8px 4px;}
    .poprow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;font:400 10px/1 var(--mono);color:var(--n700);cursor:pointer;}
    .poprow:hover{background:var(--n100);}
    .chk{width:12px;height:12px;border-radius:3px;border:1px solid var(--n500);flex:none;}
    .chk.on{background:var(--accent);border-color:var(--accent);}
    .poprow.action{color:var(--n600);border-top:1px solid var(--divider);margin-top:4px;padding-top:9px;}

    .canvas{height:190px;background:#fff;background-image:radial-gradient(rgba(32,30,29,.10) 1px,transparent 1px);background-size:18px 18px;box-shadow:inset 0 0 0 1px rgba(32,30,29,.10);position:relative;border-radius:0 0 8px 8px;}
    .canvas .tag{position:absolute;left:12px;top:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--divider);background:var(--n100);font:400 10px/1 var(--mono);color:var(--n700);}
  </style>
</helmet>

<div class="frame">
  <div class="mode-label">Variant &mdash; view cluster as a popover</div>
  <div class="stack">

    <div class="topbar">
      <span class="wordmark">semantic box</span>
      <div class="seg">
        <button class="seg-opt">normal</button>
        <button class="seg-opt">basal</button>
        <button class="seg-opt">her2</button>
        <button class="seg-opt sel">luminal-a</button>
        <button class="seg-opt">luminal-b</button>
      </div>
      <button class="tpill">manage graphs</button>
      <span class="spacer"></span>
      <input class="search" value="search &amp; jump" readonly>
      <div class="vrule"></div>
      <span class="tlabel">Mode</span>
      <div class="seg"><button class="seg-opt sel">layers</button><button class="seg-opt">compare</button></div>
    </div>

    <div class="toolbar">
      <span class="tlabel">Focus</span>
      <div class="seg"><button class="seg-opt">none</button><button class="seg-opt sel">highlight</button><button class="seg-opt">filter</button></div>
      <span class="tlabel">Hops</span>
      <div class="seg"><button class="seg-opt hop">1</button><button class="seg-opt hop sel">2</button><button class="seg-opt hop">3</button></div>
      <span class="tlabel">Direction</span>
      <div class="seg"><button class="seg-opt sel">&#8594; down</button><button class="seg-opt">&#8592; up</button><button class="seg-opt">&#8646; both</button></div>

      <span class="spacer"></span>

      <div class="pop">
        <button class="tpill on">view &#9662;</button>
        <div class="popmenu">
          <div class="grp">Panels</div>
          <div class="poprow"><span class="chk on"></span>rail</div>
          <div class="poprow"><span class="chk on"></span>inspector</div>
          <div class="poprow"><span class="chk on"></span>trace tree</div>
          <div class="grp">Canvas overlays</div>
          <div class="poprow"><span class="chk on"></span>labels</div>
          <div class="poprow"><span class="chk on"></span>info band</div>
          <div class="poprow"><span class="chk on"></span>minimap</div>
          <div class="poprow action">reset pan &amp; zoom</div>
        </div>
      </div>
    </div>

    <div class="canvas"><span class="tag">L3 &middot; clustered &middot; 118 n &middot; 190 e &middot; focus highlight &middot; 2 hop</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
